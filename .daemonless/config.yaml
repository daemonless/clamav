# dbuild configuration file
# Place in .daemonless/config.yaml or .dbuild.yaml (higher priority)
#
# Full reference: https://github.com/daemonless/dbuild

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"
      aliases: ["latest"]
      default: true

cit:
  # clamd speaks its own TCP protocol, not HTTP
  mode: port
  port: 3310
  # freshclam fetches the full database before clamd starts
  wait: 900
